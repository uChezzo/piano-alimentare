<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6F1">
<title>Piano</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icona-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sfondo:#F4F6F1; --carta:#FFFFFF; --inchiostro:#17211C; --tenue:#5A6B60;
  --lieve:#8A968E; --bordo:#E6EAE2; --bordo2:#DDE3D8; --allarme:#C0392B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;background:var(--sfondo);
  color:var(--inchiostro);font-size:15px;line-height:1.45;
  max-width:520px;margin:0 auto;padding:0 18px calc(88px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:400;margin:0}
:focus-visible{outline:2px solid var(--inchiostro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- intestazione --- */
.testa{padding:26px 0 18px}
.data{font-size:12.5px;color:#7A867E;letter-spacing:.3px}
.grande{font-size:60px;line-height:.95;margin-top:6px}
.grande span{font-size:25px;color:#A8B2A9}
.sotto{font-size:13.5px;color:var(--tenue);margin-top:6px}
h2.sez{font-size:19px;margin:30px 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
h2.sez em{font-style:normal;font-family:'Inter';font-size:11.5px;color:var(--lieve)}
.pill{font-family:'Inter';font-size:10.5px;background:var(--inchiostro);color:var(--sfondo);padding:2px 8px;border-radius:20px}

/* --- righe obiettivo --- */
.riga{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:15px;
  border:1.5px solid var(--bordo);background:var(--carta);text-align:left;margin-bottom:10px;
  transition:background .15s,border-color .15s,transform .1s}
.riga:active{transform:scale(.985)}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;
  flex-shrink:0;background:#F0F3EC;color:var(--tenue)}
.corpo{flex:1;min-width:0}
.nome{font-size:14.5px;font-weight:500}
.nota{font-size:11.5px;color:var(--lieve);margin-top:1px}
.mini{display:block;height:3px;background:var(--bordo);border-radius:2px;margin-top:7px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:2px;transition:width .25s}
.val{font-size:14px;font-weight:600;min-width:36px;text-align:right;font-variant-numeric:tabular-nums;color:var(--lieve)}

/* --- calendario e barrette --- */
.griglia{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:10.5px;color:#9AA69C;text-align:center;padding-bottom:4px}
.cella{aspect-ratio:1/1.18;border-radius:11px;border:1px solid var(--bordo);background:var(--carta);
  display:grid;justify-items:center;align-content:center;gap:4px;padding:2px;transition:background .15s}
.cella.oggi{border-color:var(--inchiostro)}
.cella.sel{background:var(--inchiostro)}
.cella.sel .num{color:var(--sfondo)}
.num{font-size:13px;color:var(--tenue);font-variant-numeric:tabular-nums}
.barrette{display:flex;gap:2px;justify-content:center;height:13px}
.b{width:3px;border-radius:2px;display:flex;align-items:flex-end;overflow:hidden;background:#EDF0EA}
.cella.sel .b{background:#33443B}
.b i{width:100%;border-radius:2px;transition:height .25s}
.legenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px}
.legenda span{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--tenue)}
.tacca{width:3px;height:11px;border-radius:2px;display:inline-block}

/* --- settimana --- */
.sett{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sg{display:grid;justify-items:center;gap:5px}
.sl{font-size:10.5px;color:#9AA69C}
.sc{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;
  border:1px solid var(--bordo2);font-variant-numeric:tabular-nums}
.sc.pieno{background:var(--inchiostro);color:var(--sfondo)}
.sc.oggi{border-color:var(--inchiostro)}

/* --- schede e pannelli --- */
.carta{background:var(--carta);border:1px solid var(--bordo);border-radius:15px;padding:14px 16px;margin-bottom:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numerone{font-family:'Fraunces',Georgia,serif;font-size:30px}
.etich{font-size:11.5px;color:var(--lieve);margin-top:2px}
.barra{height:6px;background:var(--bordo);border-radius:3px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:3px;transition:width .3s}
.vuoto{border:1px dashed var(--bordo2);border-radius:14px;padding:22px;text-align:center;
  font-size:13px;color:var(--lieve)}

/* --- pasti --- */
.pasto{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pasto header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.momento{font-size:11px;color:var(--lieve);text-transform:none}
.macro{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--tenue);font-variant-numeric:tabular-nums}
.macro b{font-weight:600;color:var(--inchiostro)}
.dettatura{display:flex;gap:8px;align-items:flex-start}
textarea.parla{flex:1;min-height:76px;border-radius:13px;border:1px solid var(--bordo2);
  padding:12px;background:var(--carta);resize:vertical;color:var(--inchiostro)}
.mic{width:48px;height:48px;border-radius:14px;background:var(--inchiostro);color:var(--sfondo);
  font-size:19px;flex-shrink:0;display:grid;place-items:center}
.mic.attivo{background:var(--allarme);animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.6}}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bordo2);background:var(--carta);
  border-radius:20px;padding:6px 12px;font-size:12.5px;margin:0 6px 6px 0}
.chip.on{background:var(--inchiostro);color:var(--sfondo);border-color:var(--inchiostro)}

/* --- comandi --- */
.btn{background:var(--inchiostro);color:var(--sfondo);border-radius:11px;padding:12px 16px;
  font-size:13.5px;font-weight:500}
.btn.vuoto{background:transparent;color:var(--inchiostro);border:1px solid var(--bordo2)}
.btn:disabled{opacity:.45}
.fila{display:flex;gap:8px;flex-wrap:wrap}
.campo{width:100%;border-radius:11px;border:1px solid var(--bordo2);padding:11px;background:var(--carta);
  margin-top:6px;color:var(--inchiostro)}
label.et{font-size:12px;color:var(--tenue);display:block;margin-top:14px}
.step{display:flex;align-items:center;gap:2px;background:#F0F3EC;border-radius:9px;padding:2px}
.step button{width:26px;height:26px;border-radius:7px;background:transparent;font-size:15px;color:var(--tenue)}
.step span{font-size:12.5px;min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.sw{width:38px;height:22px;border-radius:20px;position:relative;flex-shrink:0;background:var(--bordo2);
  transition:background .2s}
.sw.on{background:var(--inchiostro)}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;
  transition:transform .2s}
.sw.on i{transform:translateX(16px)}

/* --- avvisi --- */
#stato{position:fixed;top:0;left:0;right:0;text-align:center;font-size:12px;padding:7px;
  background:var(--inchiostro);color:var(--sfondo);z-index:20;display:none}
#stato.mostra{display:block}
.errore{background:#FDECEA;border:1px solid #F5C6C2;color:#8B2B21;border-radius:11px;
  padding:10px 12px;font-size:12.5px;margin-top:10px}
.ok{background:#EAF5EC;border:1px solid #C6E3CC;color:#245E33;border-radius:11px;
  padding:10px 12px;font-size:12.5px;margin-top:10px}

/* --- navigazione --- */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:grid;grid-template-columns:repeat(5,1fr);background:rgba(244,246,241,.94);
  backdrop-filter:blur(12px);border-top:1px solid #E1E6DC;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{background:none;padding:11px 0 13px;display:grid;justify-items:center;gap:4px;
  position:relative;color:var(--lieve);font-size:10.5px}
nav button.on{color:var(--inchiostro)}
nav button.on::before{content:"";position:absolute;top:0;width:26px;height:2px;background:var(--inchiostro);border-radius:2px}
nav button i{font-style:normal;font-size:17px;line-height:1}
</style>
</head>
<body>

<div id="stato"></div>
<main id="vista"></main>

<nav>
  <button data-tab="oggi"     class="on"><i>◎</i>Oggi</button>
  <button data-tab="mese"><i>▦</i>Mese</button>
  <button data-tab="pasti"><i>✚</i>Pasti</button>
  <button data-tab="consigli"><i>◇</i>Consigli</button>
  <button data-tab="piano"><i>⚙</i>Piano</button>
</nav>

<script src="./piano.js"></script>
<script src="./app.js"></script>
</body>
</html>
